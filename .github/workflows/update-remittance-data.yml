name: Daily Market Update & Content Generation

on:
  schedule:
    # Runs daily at 00:00 UTC (09:00 KST)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'public/fee-data.json'

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ═══════════════════════════════════════
      # Step 1: 환율/수수료 데이터 갱신
      # ═══════════════════════════════════════
      - name: Update exchange rates & fees
        id: update
        run: |
          echo "📊 Updating exchange rates and fees..."
          node scripts/update-fees.mjs
          echo "update_status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ═══════════════════════════════════════
      # Step 2: histData.js 월별 환율 자동 갱신
      # ═══════════════════════════════════════
      - name: Update historical rate data
        id: hist
        run: |
          echo "📈 Updating monthly historical rates..."
          node scripts/update-hist-data.mjs
          echo "hist_status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ═══════════════════════════════════════
      # Step 3: 시장 컨텍스트 분석
      # ═══════════════════════════════════════
      - name: Generate market context
        id: market
        run: |
          echo "📡 Analyzing market context..."
          node scripts/fetch-market-context.mjs
          echo "market_status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ═══════════════════════════════════════
      # Step 4: AI 블로그 포스트 생성 (시장 분석 기반)
      # ═══════════════════════════════════════
      - name: Generate AI blog post (market-driven)
        if: steps.market.outputs.market_status == 'success'
        run: |
          echo "🤖 Generating market-driven blog post..."
          node scripts/generate-post.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        continue-on-error: true

      # ═══════════════════════════════════════
      # Step 5: Notion → posts.json 동기화
      # ═══════════════════════════════════════
      - name: Sync posts from Notion
        run: node scripts/update-posts.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        continue-on-error: true

      # ═══════════════════════════════════════
      # Step 6: 변경사항 커밋 & 배포
      # ═══════════════════════════════════════
      - name: Check for data changes
        id: changes
        run: |
          if git diff --quiet public/fee-data.json public/posts.json src/utils/histData.js; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Data changed, will commit and deploy"
            echo "changed=true" >> $GITHUB_OUTPUT
            # 변경 요약
            echo "--- Change Summary ---"
            git diff --stat public/fee-data.json public/posts.json src/utils/histData.js
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fee-data.json public/posts.json public/sitemap.xml src/utils/histData.js
          git commit -m "chore: update remittance data - $(date -u +'%Y-%m-%d %H:%M UTC')

          Auto-updated exchange rates, fees, historical data, and blog content
          - fee-data: $([ -n "$(git diff --cached --name-only public/fee-data.json)" ] && echo 'updated' || echo 'unchanged')
          - histData: $([ -n "$(git diff --cached --name-only src/utils/histData.js)" ] && echo 'updated' || echo 'unchanged')
          - posts: $([ -n "$(git diff --cached --name-only public/posts.json)" ] && echo 'updated' || echo 'unchanged')

          Co-Authored-By: GitHub Actions <github-actions[bot]@users.noreply.github.com>"
          git push

      - name: Build application
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build
        env:
          VITE_WORKER_URL: https://remittance-rates.remittance-app.workers.dev

      - name: Deploy to Firebase
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cross-border-remittance-lookup
          channelId: live

      # ═══════════════════════════════════════
      # Step 7: fixed-fees 경과 알림
      # ═══════════════════════════════════════
      - name: Check fixed-fees staleness
        run: |
          LAST_UPDATE=$(node -e "const d=JSON.parse(require('fs').readFileSync('scripts/fixed-fees.json','utf-8'));console.log(d._lastManualUpdate||'unknown')")
          DAYS_OLD=$(node -e "const d=JSON.parse(require('fs').readFileSync('scripts/fixed-fees.json','utf-8'));const diff=Math.floor((Date.now()-new Date(d._lastManualUpdate).getTime())/86400000);console.log(diff)")
          echo "fixed-fees last updated: ${LAST_UPDATE} (${DAYS_OLD} days ago)"
          echo "days_old=${DAYS_OLD}" >> $GITHUB_OUTPUT
        id: fixed_fees
        continue-on-error: true

      - name: Create fixed-fees update reminder
        if: steps.fixed_fees.outputs.days_old > 30
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'fixed-fees-update',
              state: 'open'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📋 fixed-fees.json 수동 갱신 필요',
                body: `fixed-fees.json이 **${steps.fixed_fees.outputs.days_old}일** 경과했습니다.\n\n한국 서비스(센트비, 모인, 와이어바알리, 토스, 하나은행, 신한은행)의 수수료를 확인하고 갱신해주세요.\n\n파일: \`scripts/fixed-fees.json\``,
                labels: ['fixed-fees-update', 'maintenance']
              });
            }
        continue-on-error: true

      # ═══════════════════════════════════════
      # Step 8: 파이프라인 상태 리포트
      # ═══════════════════════════════════════
      - name: Pipeline status report
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          echo "📋 PIPELINE STATUS REPORT"
          echo "═══════════════════════════════════════"
          echo "Fee data update: ${{ steps.update.outputs.update_status || 'failed' }}"
          echo "Hist data update: ${{ steps.hist.outputs.hist_status || 'failed' }}"
          echo "Market context:   ${{ steps.market.outputs.market_status || 'failed' }}"
          echo "Data changed:     ${{ steps.changes.outputs.changed || 'unknown' }}"
          echo "Fixed-fees age:   ${{ steps.fixed_fees.outputs.days_old || '?' }} days"
          echo "═══════════════════════════════════════"

      # ═══════════════════════════════════════
      # Step 9: 실패 시 알림
      # ═══════════════════════════════════════
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Daily Update Failed - ' + new Date().toISOString().split('T')[0],
              body: `## Update Failure Report\n\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n**Time:** ${new Date().toISOString()}\n\n### Step Results\n- Fee update: ${{ steps.update.outputs.update_status || 'FAILED' }}\n- Hist update: ${{ steps.hist.outputs.hist_status || 'FAILED' }}\n- Market context: ${{ steps.market.outputs.market_status || 'FAILED' }}\n\nCheck workflow logs for details.`,
              labels: ['automation', 'bug']
            })
