name: Check Fixed-Fees Staleness

on:
  schedule:
    # Every Monday at 01:00 UTC (10:00 KST)
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  check-staleness:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check last update date
        id: check
        run: |
          LAST_UPDATE=$(node -e "
            const data = require('./scripts/fixed-fees.json');
            console.log(data._lastManualUpdate);
          ")
          DAYS_AGO=$(( ($(date +%s) - $(date -d "$LAST_UPDATE" +%s)) / 86400 ))
          echo "last_update=$LAST_UPDATE" >> $GITHUB_OUTPUT
          echo "days_ago=$DAYS_AGO" >> $GITHUB_OUTPUT
          if [ "$DAYS_AGO" -ge 14 ]; then
            echo "stale=true" >> $GITHUB_OUTPUT
          else
            echo "stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure label exists
        if: steps.check.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'fixed-fees-stale',
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'fixed-fees-stale',
                color: 'FBCA04',
                description: 'fixed-fees.json 갱신 필요 알림',
              });
            }

      - name: Check for existing open issue
        if: steps.check.outputs.stale == 'true'
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fixed-fees-stale',
            });
            core.setOutput('exists', issues.data.length > 0 ? 'true' : 'false');

      - name: Create staleness issue
        if: steps.check.outputs.stale == 'true' && steps.existing.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const lastUpdate = '${{ steps.check.outputs.last_update }}';
            const daysAgo = '${{ steps.check.outputs.days_ago }}';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 fixed-fees.json 갱신 필요 (마지막 갱신: ${lastUpdate})`,
              body: `## 고정 수수료 데이터 갱신 알림

            \`scripts/fixed-fees.json\`의 마지막 수동 갱신일이 **${lastUpdate}** (${daysAgo}일 전)입니다.
            이 파일은 월 1~2회 수동 확인·갱신이 권장됩니다.

            ### 확인 대상 서비스
            - 센드비 (sentbe)
            - 모인 (moin)
            - 와이어바알리 (wirebarley)
            - 토스 (toss)
            - 하나은행 (hana)
            - 신한은행 (shinhan)

            ### 확인 항목
            - [ ] 수수료 (fee) 변동 여부
            - [ ] 스프레드 (spread) 변동 여부
            - [ ] 프로모션 변경/종료 여부
            - [ ] 지원 통화 변경 여부
            - [ ] 송금 속도 변경 여부

            ### 갱신 방법
            1. 각 서비스 공식 사이트에서 최신 수수료 확인
            2. \`scripts/fixed-fees.json\` 수정
            3. \`_lastManualUpdate\` 날짜를 오늘로 변경
            4. 커밋 & 푸시 → 자동 배포

            > 이 이슈는 GitHub Actions에 의해 자동 생성되었습니다.`,
              labels: ['fixed-fees-stale'],
            });
